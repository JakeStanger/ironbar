name: PR Quality

permissions:
  contents: read
  issues: read
  pull-requests: write

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  anti-slop:
    name: Anti-Slop Check
    runs-on: ubuntu-latest
    steps:
      - uses: peakoss/anti-slop@v0
        with:
          max-failures: 3
          max-description-length: 0
          max-emoji-count: 1
          max-code-references: 3
          max-added-comments: 5
          blocked-terms: "CLANKER"
          exempt-pr-label: 'Z:Ignore AI Checks'
          failure-add-pr-labels: 'Z:Slop Detected'
          failure-pr-message: |
            This PR has been automatically detected as being AI slop. 
            
            If you believe this is incorrect, please reply and it will be manually reviewed.