name: Publish Schema

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
    paths:
      - 'src/**/*'
      - 'Cargo.*'
      - 'build.rs'
      - '.github/workflows/schema.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-Dwarnings'

jobs:
  publish-schema:
    name: 'Publish Schema'
    runs-on: ubuntu-latest
    container: ghcr.io/jakestanger/ironbar-build:master

    steps:
      - uses: actions/checkout@v7

      - name: Install cURL
        run: apt-get update && apt-get install --assume-yes curl

      - uses: Swatinem/rust-cache@v2
        name: Cache dependencies

      - name: Build
        run: cargo build

      - name: Print schema
        run: cargo run -- --print-schema > target/schema.json

      - name: Upload schema to bucket
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            filename="schema-${GITHUB_REF_NAME}"
          else
            filename="schema"
          fi
          
          curl --fail-with-body -sS \
            --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
            --aws-sigv4 "aws:amz:auto:s3" \
            -H "x-amz-content-sha256: UNSIGNED-PAYLOAD" \
            -H "Content-Type: application/json" \
            -T target/schema.json \
            "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/ironbar/${filename}.json"