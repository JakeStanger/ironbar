[workspace]
members = [
    "ironbar-args",
    "ironbar-cli",
    "ironbar-core",
    "ironbar-ipc-types",
    "ironbar-macros"
]

[workspace.package]
version = "0.20.0-pre"
authors = [ "Jake Stanger <mail@jstanger.dev>" ]
edition = "2024"
license = "MIT"
description = "Customisable GTK Layer Shell wlroots/sway bar"
repository = "https://github.com/jakestanger/ironbar"
categories = ["gui"]
keywords = ["gtk", "bar", "wayland", "wlroots", "gtk-layer-shell"]

[workspace.dependencies]
# internal
ironbar-args = { path = "ironbar-args", default-features = false }
ironbar-core = { path = "ironbar-core" }
ironbar-ipc-types = { path = "ironbar-ipc-types" }
ironbar-macros = { path = "ironbar-macros" }

# external
clap = { version = "4.6.7", features = ["derive"] } # args, ipc-types
serde = { version = "1.0.229", features = ["derive"] } # bar, core, ipc-types
serde_json = "1.0.154" # bar, cli
tracing = "0.1.44" # bar, ipc-types

[package]
name = "ironbar"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target-arch }{ archive-suffix }"

[package.metadata.deb]
maintainer = "Jake Stanger"
copyright = "© copyright 2022 Jake Stanger"
extended-description = "A customisable Wayland GTK4 bar."
depends = "$auto"
assets = [
    ["target/release/ironbar", "usr/bin/", "755"],
    ["target/release/ironbard", "usr/bin/", "755"],
    ["ironbar.service", "usr/lib/systemd/user/ironbar.service", "644"],
]

[[bin]]
name = "ironbard"
path = "src/main.rs"

[features]
default = [
    "battery",
    "bindmode+all",
    "bluetooth",
    "brightness",
    "cli",
    "cairo",
    "clipboard",
    "clock",
    "config+all",
    "custom",
    "focused",
    "http",
    "inhibit",
    "ipc",
    "keyboard+all",
    "launcher",
    "label",
    "menu",
    "music+all",
    "network_manager",
    "notifications",
    "power_profiles",
    "script",
    "sys_info",
    "tray",
    "volume",
    "workspaces+all",
    "extras"
]

# -- core features --

cli = ["ipc", "dep:ironbar-args"]
ipc = ["dep:ironbar-ipc-types", "dep:serde_json"]

http = ["dep:reqwest"]

config = []
"config+all" = [
    "config+json",
    "config+yaml",
    "config+toml",
    "config+corn"
]
"config+json" = ["config", "config/json"]
"config+yaml" = ["config", "config/yaml"]
"config+toml" = ["config", "config/toml"]
"config+corn" = ["config", "config/corn"]

lua = ["dep:lua-src", "dep:mlua"]

# -- module features --

battery = ["zbus", "futures-lite"]

bindmode = []
"bindmode+all" = ["bindmode+sway", "bindmode+hyprland"]
"bindmode+sway" = ["bindmode", "sway"]
"bindmode+hyprland" = ["bindmode", "hyprland"]

bluetooth = ["dep:bluer"]

brightness = ["zbus"]

cairo = ["lua"]

clipboard = ["dep:rustix"]

clock = ["chrono"]

custom = []

focused = []

inhibit = ["chrono"]

keyboard = ["dep:colpetto", "dep:evdev-rs", "dep:rustix", "futures-lite"]
"keyboard+all" = ["keyboard", "keyboard+sway", "keyboard+hyprland"]
"keyboard+sway" = ["keyboard", "sway"]
"keyboard+hyprland" = ["keyboard", "hyprland"]

label = []

launcher = []

menu = []

music = []
"music+all" = ["music", "music+mpris", "music+mpd"]
"music+mpris" = ["music", "mpris"]
"music+mpd" = ["music", "mpd-utils"]

network_manager = ["futures-lite", "zbus"]

notifications = ["zbus"]

power_profiles = []

script = []

sys_info = ["dep:sysinfo"]

tray = ["system-tray"]

volume = ["libpulse-binding"]

workspaces = ["futures-lite"]
"workspaces+all" = ["workspaces", "workspaces+sway", "workspaces+hyprland", "workspaces+niri"]
"workspaces+sway" = ["workspaces", "sway"]
"workspaces+hyprland" = ["workspaces", "hyprland", "dep:serde_json"]
"workspaces+niri" = ["workspaces", "niri"]

sway = ["swayipc-async", "futures-lite"]

niri = ["dep:serde_json"]

extras = ["dep:schemars", "ironbar-args?/schema"]

# -- test features --
"battery.test" = ["battery"]

[dependencies]
# core internal
ironbar-core.workspace = true
ironbar-args = { workspace = true, optional = true }
ironbar-macros.workspace = true
ironbar-ipc-types = { workspace = true, optional = true, features = ["tracing"] }

# core
gtk = { package = "gtk4", version = "0.10.0", features = ["v4_20"] }
gtk-layer-shell = { package = "gtk4-layer-shell", version = "0.6.3" }
glib = "0.21.1"
tokio = { version = "1.50.0", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "process",
    "sync",
    "io-util",
    "net",
    "fs",
    "signal"
] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-error = { version = "0.2.1", default-features = false }
tracing-appender = "0.2.5"
strip-ansi-escapes = "0.2.0"
thiserror = "2.0.18"
color-eyre = "0.6.5"
serde.workspace = true
indexmap = { version = "2.14.0", features = ["serde"] }
dirs = "7.0.0"
walkdir = "2.5.0"
notify = { version = "8.2.0", default-features = false }
wayland-client = "0.31.1"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
smithay-client-toolkit = { version = "0.20.0", default-features = false, features = [
    "calloop",
] }
config = { version = "0.15.23", default-features = false }

# bluetooth
bluer = { version = "0.17.4", optional = true, features = ["bluetoothd"] }

# http
reqwest = { version = "0.13.4", default-features = false, features = ["default-tls", "http2"], optional = true }

# cairo
lua-src = { version = "551.0.0", optional = true }
mlua = { version = "0.12.2", optional = true, features = ["luajit", "send", "async", "macros"] }

# keyboard
colpetto = { version = "0.7.0", features = ["tokio", "tracing"], optional = true }
evdev-rs = { version = "0.6.3", optional = true }

# music
mpd-utils = { version = "0.2.2", optional = true }
mpris = { version = "2.1.0", optional = true }

# sys_info
sysinfo = { version = "0.39.3", optional = true }

# tray
system-tray = { version = "0.8.6", optional = true }

# volume
libpulse-binding = { version = "2.30.1", optional = true }

# shared
futures-lite = { version = "2.6.1", optional = true } # battery, network_manager, workspaces, keyboard
zbus = { version = "6.0.0", default-features = false, features = ["tokio", "proxy"], optional = true } # brightness, battery, network_manager, notifications
swayipc-async = { version = "3.0.0", optional = true } # workspaces, keyboard
chrono = { version = "0.4.44", optional = true, default-features = false, features = ["clock", "unstable-locales"] } # clock, inhibit
hyprland = { version = "0.4.0-beta.3", optional = true } # workspaces, keyboard
rustix = { version = "1.1.3", default-features = false, features = ["std", "fs", "pipe", "event"], optional = true } # clipboard, input
serde_json = { workspace = true, optional = true } # ipc, niri

# extras
schemars = { version = "1.2.1", optional = true, features = ["indexmap2"] }

[build-dependencies]
vergen-git2 = "9.1.0"
